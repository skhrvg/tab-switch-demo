<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Холст</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body data-app="canvas">
<header id="shell-header"></header>
<main>
  <div class="app-title">
    <h1>Холст</h1>
    <p>Рисунок нигде не сохраняется — только в этой вкладке.</p>
  </div>
  <section class="card">
    <div class="card-head">
      <h2>Рисуйте мышью или пальцем</h2>
      <button type="button" class="ghost" id="clear">Очистить</button>
    </div>
    <canvas id="canvas"></canvas>
  </section>
  <div id="shell-panels"></div>
</main>
<script src="../shared/shell.js"></script>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
const ratio = window.devicePixelRatio || 1;

// Размер холста задаётся один раз: изменение width/height стёрло бы рисунок.
canvas.width = canvas.clientWidth * ratio;
canvas.height = canvas.clientHeight * ratio;
ctx.scale(ratio, ratio);
ctx.lineWidth = 4;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.strokeStyle = accent;

const point = (event) => {
  const box = canvas.getBoundingClientRect();
  return [
    ((event.clientX - box.left) * canvas.width) / ratio / box.width,
    ((event.clientY - box.top) * canvas.height) / ratio / box.height,
  ];
};

let drawing = false;
canvas.addEventListener('pointerdown', (event) => {
  drawing = true;
  canvas.setPointerCapture(event.pointerId);
  ctx.beginPath();
  ctx.moveTo(...point(event));
});
canvas.addEventListener('pointermove', (event) => {
  if (!drawing) return;
  ctx.lineTo(...point(event));
  ctx.stroke();
});
const stop = () => (drawing = false);
canvas.addEventListener('pointerup', stop);
canvas.addEventListener('pointercancel', stop);
document.getElementById('clear').addEventListener('click', () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
});
</script>
</body>
</html>
